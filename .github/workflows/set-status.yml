name: Set shelter status

# Run this by hand (Actions → Set shelter status → Run workflow) when the
# authorities open or close the community haze shelters. "closed" shows a
# notice at the top of the site and above search results; "open" removes it.
on:
  workflow_dispatch:
    inputs:
      state:
        description: "Are the haze shelters open or closed?"
        type: choice
        options: [closed, open]
        default: closed
      since:
        description: "Since when, as people should read it (e.g. 7 November 2026). Leave blank for today."
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: set-status
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      STATE: ${{ github.event.inputs.state }}
      SINCE: ${{ github.event.inputs.since }}
    steps:
      - uses: actions/checkout@v5
      - name: Write docs/status.json
        run: |
          since="${SINCE:-$(TZ=Asia/Singapore date '+%-d %B %Y')}"
          jq -n --arg state "$STATE" --arg since "$since" '{state: $state, since: $since}' > docs/status.json
          cat docs/status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          if git diff --cached --quiet; then echo "Already set."; exit 0; fi
          git commit -m "Shelters are $STATE (since $since)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # Pushes made by this workflow don't start other workflows.
          gh workflow run site.yml --ref "$GITHUB_REF_NAME"
